name: generate metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Requires a repository secret METRICS_TOKEN: a personal access token
      # (classic, no scopes needed; or fine-grained with public read access).
      # The built-in GITHUB_TOKEN cannot read user-level contribution data.
      - name: isometric contribution calendar (full year)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fujitatomoya
          filename: metrics.isocalendar.svg
          committer_branch: metrics
          committer_message: "update ${filename} [skip ci]"
          base: ""
          config_timezone: Asia/Tokyo
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
